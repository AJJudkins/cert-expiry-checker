[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cert-expiry-checker"
version = "0.1.0"
description = "Check TLS certificate expiry for a list of hostnames, with CI-friendly exit codes."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "cryptography"]

[project.scripts]
cert-expiry-checker = "certcheck:main"

[tool.setuptools]
py-modules = ["certcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
